; Asterisk Logger Configuration
;
; telauth.log にダイヤルプランの実行 (verbose) と DTMF の受信を記録する。
; 着信テストで「押したキーが届いたか / どの拡張に飛んだか」を追うために使う。
;   docker exec telauth-asterisk-1 tail -f /var/log/asterisk/telauth.log
; SIP スキャナーの登録試行 (registrar の WARNING) は messages.log 側に出る。

[general]

[logfiles]
console => notice,warning,error
messages.log => notice,warning,error
telauth.log => notice,warning,error,verbose(5),dtmf
