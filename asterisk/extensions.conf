; Asterisk Dialplan Configuration

[from-brastel]
; s 拡張（匿名エンドポイント経由の着信 = DIDなし）
exten => s,1,NoOp(Incoming call from ${CALLERID(num)})
 same => n,Answer()
 same => n,Wait(1)
 same => n,GotoIf($["${CALLERID(num)}" = ""]?nocallerid)
 same => n,GotoIf($["${CALLERID(num)}" = "anonymous"]?nocallerid)
 ; FastAPIを呼び出してWAVを生成・OTPをDB保存
 same => n,System(curl -s "http://127.0.0.1:8000/api/v1/inbound?phone_number=${CALLERID(num)}")
 same => n,Wait(1)
 ; 生成された音声を再生
 same => n,Playback(telauth/otp_${CALLERID(num)})
 ; 通話完了通知（秒数をDBに記録）
 same => n,System(curl -s "http://127.0.0.1:8000/api/v1/call-complete?phone_number=${CALLERID(num)}&duration=${ANSWEREDTIME}")
 same => n,Hangup()

 same => n(nocallerid),Playback(privacy-unident)
 same => n,Hangup()

; _X. 拡張（DID番号が付いている着信）
exten => _X.,1,NoOp(Incoming call from ${CALLERID(num)} to ${EXTEN})
 same => n,Answer()
 same => n,Wait(1)
 same => n,GotoIf($["${CALLERID(num)}" = ""]?nocallerid)
 same => n,GotoIf($["${CALLERID(num)}" = "anonymous"]?nocallerid)
 same => n,System(curl -s "http://127.0.0.1:8000/api/v1/inbound?phone_number=${CALLERID(num)}")
 same => n,Wait(1)
 same => n,Playback(telauth/otp_${CALLERID(num)})
 same => n,System(curl -s "http://127.0.0.1:8000/api/v1/call-complete?phone_number=${CALLERID(num)}&duration=${ANSWEREDTIME}")
 same => n,Hangup()

 same => n(nocallerid),Playback(privacy-unident)
 same => n,Hangup()

[outbound-otp]
exten => _X.,1,NoOp(OTP Call to ${EXTEN})
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(${WAVFILE})
 same => n,Hangup()
