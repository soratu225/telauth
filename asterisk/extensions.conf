; Asterisk Dialplan Configuration
;
; 着信フロー:
;   着信 → IVRメニュー再生 (asterisk/sounds/ivr_menu.wav)
;     「カスタマーサポートでございます。電話認証をご利用の方は 1 を、アピレンティックへ
;       お問い合わせの方は 2 を、アイズンホスティングにお問い合わせの方は 3 を、
;       内線番号をお持ちの方は 4 を押してください。もう一度お聞きになる場合は # を押してください。」
;     1        → 電話認証 (画面の認証コードを入力 → 「*」で確定 → 照合)
;     2, 3     → 混雑案内 (asterisk/sounds/queue_notice.wav) → 保留音を流し続ける
;     4        → 内線 (内線番号を入力 → Discord で担当者を呼び出し → 担当者のブラウザ (WebRTC) へ接続)
;     #        → メニューをもう一度再生
;     無入力/無効入力 → メニューを再生し直す (3回で切断)
;   非通知 (番号なし / anonymous / 発信者番号の通知が拒否) → 案内 (no_callerid.wav) を流して切断
;
; 音声ファイルは Dockerfile.asterisk で /var/lib/asterisk/sounds/ivr/ にコピーされる。
; 認証コードの照合は FastAPI (/api/v1/inbound-verify) が行う。

[general]
static=yes
writeprotect=no

[from-brastel]
; s 拡張（匿名エンドポイント経由の着信 = DIDなし）
exten => s,1,NoOp(Incoming call from ${CALLERID(num)})
 same => n,Goto(ivr-menu,s,1)

; _X. 拡張（DID番号が付いている着信）
exten => _X.,1,NoOp(Incoming call from ${CALLERID(num)} to ${EXTEN})
 same => n,Goto(ivr-menu,s,1)

; ---------------------------------------------------------------------------
; IVRメニュー
; ---------------------------------------------------------------------------
[ivr-menu]
exten => s,1,Answer()
 ; 応答時刻を記録 (通話秒数の算出に使用。ANSWEREDTIME は Dial() 専用で着信では空になる)
 same => n,Set(ANSWER_EPOCH=${EPOCH})
 same => n,Wait(1)
 ; 非通知チェック: 番号が空 / anonymous 等 / 通知拒否(prohib*) なら案内して切断
 same => n,Set(CID_NUM=${TOLOWER(${CALLERID(num)})})
 same => n,GotoIf($["${CID_NUM}" = "" | "${CID_NUM}" = "anonymous" | "${CID_NUM}" = "unknown" | "${CID_NUM}" = "restricted" | "${CID_NUM}" = "withheld" | "${CID_NUM}" = "private"]?no-callerid,s,1)
 same => n,GotoIf($["${CALLERID(num-pres):0:6}" = "prohib"]?no-callerid,s,1)
 same => n,Set(MENU_TRIES=0)
 same => n(menu),Set(MENU_TRIES=$[${MENU_TRIES} + 1])
 same => n,GotoIf($[${MENU_TRIES} > 3]?giveup)
 same => n,Background(ivr/ivr_menu)
 same => n,WaitExten(5)
 same => n(giveup),Hangup()

; 1: 電話認証
exten => 1,1,Goto(otp-auth,s,1)

; 2: アピレンティック / 3: アイズン ホスティング → 混雑案内 + 保留音
exten => 2,1,Set(INQUIRY=apprentic)
 same => n,Goto(queue-hold,s,1)
exten => 3,1,Set(INQUIRY=eyesun-hosting)
 same => n,Goto(queue-hold,s,1)

; 4: 内線番号をお持ちの方
exten => 4,1,Goto(ext-menu,s,1)

; #: もう一度聴く（試行回数はリセット）
exten => #,1,Set(MENU_TRIES=0)
 same => n,Goto(s,menu)

; 無入力 (t) / 無効入力 (i) → メニューを再生し直す
exten => t,1,Goto(s,menu)
exten => i,1,Goto(s,menu)

; ---------------------------------------------------------------------------
; 電話認証 (画面に表示された認証コードを入力してもらい照合する)
;
;   案内 (otp_prompt) → ピッ (beep) → 数字を集める → 「*」で確定 → API で照合
;     成功 → 「認証が完了しました。お電話ありがとうございました。」(otp_success) → 切断
;     失敗 → 「コードが違うようです。画面をご確認の上、もう一度入力してください。」(otp_wrong) → ピッ → 再入力
;     無入力 (15秒) → 案内をもう一度流して再入力
;   照合失敗・無入力あわせて MAX_ATTEMPTS 回で切断。API 側でも有効期間内の失敗回数で総当たりを防ぐ。
; ---------------------------------------------------------------------------
[otp-auth]
exten => s,1,NoOp(OTP auth for ${CALLERID(num)})
 ; 発信者番号は SIP ヘッダ由来で信用できないため、数字と + 以外を除去してから
 ; シェル (System) と URL に渡す。
 same => n,Set(OTP_NUM=${FILTER(+0-9,${CALLERID(num)})})
 ; 念のための再チェック (通常は ivr-menu で弾かれている)
 same => n,GotoIf($["${OTP_NUM}" = ""]?no-callerid,s,1)
 ; INTERNAL_TOKEN (.env) は Asterisk では展開せず、System/SHELL のシェルに $INTERNAL_TOKEN を展開させる (ログに残さない)
 same => n,Set(API_HDR=X-Internal-Token: $INTERNAL_TOKEN)
 same => n,Set(MAX_ATTEMPTS=5)
 same => n,Set(ATTEMPTS=0)
 ; 着信を記録 (電話番号・時刻)。シークレットが無ければ API 側で作成される
 same => n,System(curl -s -m 10 -H "${API_HDR}" -G --data-urlencode "phone_number=${OTP_NUM}" "http://127.0.0.1:8000/api/v1/inbound")
 ; 「電話認証サービスです。ピーッとなったら画面に表示されている認証コードを入力して、コメジルシを押してください。…」
 same => n(prompt),Playback(ivr/otp_prompt)
 ; 入力受付: ピッ → 数字は _X で集め、* で確定 (WaitExten で1桁ずつ待つ)
 same => n(input),Set(CODE=)
 same => n,Set(ATTEMPTS=$[${ATTEMPTS} + 1])
 same => n,GotoIf($[${ATTEMPTS} > ${MAX_ATTEMPTS}]?giveup)
 same => n,Playback(ivr/beep)
 same => n(wait),WaitExten(15)
 same => n(giveup),NoOp(Too many attempts for ${OTP_NUM})
 same => n,Hangup()

; 数字: コードに追加して次のキーを待つ (桁数はここでは制限しない)
exten => _X,1,Set(CODE=${CODE}${EXTEN})
 same => n,Goto(s,wait)

; *: 確定 → API で照合。curl -f は 4xx/5xx で非0終了するので SYSTEMSTATUS で成否を判定する
exten => *,1,NoOp(Verifying code for ${OTP_NUM} (${LEN(${CODE})} digits))
 same => n,System(curl -sf -m 10 -H "${API_HDR}" -G --data-urlencode "phone_number=${OTP_NUM}" --data-urlencode "code=${CODE}" "http://127.0.0.1:8000/api/v1/inbound-verify")
 same => n,GotoIf($["${SYSTEMSTATUS}" = "SUCCESS"]?ok:ng)
 ; 成功: 「認証が完了しました。お電話、ありがとうございました。」
 same => n(ok),Playback(ivr/otp_success)
 same => n,Hangup()
 ; 失敗: 「コードが違うようです。画面をご確認の上、もう一度入力してください。」→ ピッ → 再入力
 same => n(ng),GotoIf($[${ATTEMPTS} >= ${MAX_ATTEMPTS}]?s,giveup)
 same => n,Playback(ivr/otp_wrong)
 same => n,Goto(s,input)

; 無入力 (15秒): 案内をもう一度流して再入力
exten => t,1,Goto(s,prompt)

; 数字と * 以外 (# など): 無視して待ち続ける
exten => i,1,NoOp(Ignoring key ${INVALID_EXTEN})
 same => n,Goto(s,wait)

; 切断時 (通常終了・途中切断とも): 応答からの経過秒数をDBに記録
exten => h,1,Set(CALL_SECONDS=$[${EPOCH} - ${ANSWER_EPOCH}])
 same => n,System(curl -s -m 10 -H "${API_HDR}" -G --data-urlencode "phone_number=${OTP_NUM}" --data-urlencode "duration=${CALL_SECONDS}" "http://127.0.0.1:8000/api/v1/call-complete")

; ---------------------------------------------------------------------------
; 非通知: 「発信者を通知して、もう一度おかけなおしください。」を流して切断
; ---------------------------------------------------------------------------
[no-callerid]
exten => s,1,NoOp(No caller ID: num="${CALLERID(num)}" pres=${CALLERID(num-pres)})
 same => n,Playback(ivr/no_callerid)
 same => n,Wait(1)
 same => n,Hangup()

; ---------------------------------------------------------------------------
; 混雑案内 → 保留音 (オペレーター接続は未実装。切られるまで保留音を流し続ける)
; ---------------------------------------------------------------------------
[queue-hold]
exten => s,1,NoOp(Queue hold for ${CALLERID(num)} inquiry=${INQUIRY})
 same => n,Playback(ivr/queue_notice)
 same => n,MusicOnHold(telauth-hold)
 same => n,Hangup()

; ---------------------------------------------------------------------------
; 内線 (内線番号を入力 → Discord で担当者を呼び出し → 担当者のブラウザへ接続)
;
;   案内 (ext_prompt) → 数字を集めて * で確定 → API /extension-call
;     RINGING <id> → 「担当者を呼び出しています」(ext_ringing) → 保留音を流しながら 3 秒ごとに状態を確認 (最大 3 分)
;         ACCEPTED <slot> → 担当者のブラウザが PJSIP/<slot> (web1..webN) として登録されるのを待ち (最大 90 秒)、Dial
;         REJECTED / ERROR → 「後ほどお掛け直しください」(ext_callback) → 切断
;         3 分経過               → API /timeout を呼んで同上
;     CLOSED  → 受付時間外の案内 (ext_closed) → 切断
;     UNKNOWN → 案内をもう一度 (3 回で切断)
;   API の応答は 1 行のテキストなので SHELL() で受け取り CUT() で分解する。
; ---------------------------------------------------------------------------
[ext-menu]
exten => s,1,NoOp(Extension menu for ${CALLERID(num)})
 same => n,Set(OTP_NUM=${FILTER(+0-9,${CALLERID(num)})})
 same => n,Set(API_HDR=X-Internal-Token: $INTERNAL_TOKEN)
 same => n,Set(API=http://127.0.0.1:8000/api/v1/extension-call)
 same => n,Set(EXT_TRIES=0)
 ; 「内線番号を入力して、コメジルシを押してください。」(再生中の押下も受け付ける)
 same => n(prompt),Set(EXT_TRIES=$[${EXT_TRIES} + 1])
 same => n,GotoIf($[${EXT_TRIES} > 3]?giveup)
 same => n,Set(EXT=)
 same => n,Background(ivr/ext_prompt)
 same => n(wait),WaitExten(10)
 same => n(giveup),Hangup()

; 数字: 内線番号に追加して次のキーを待つ
exten => _X,1,Set(EXT=${EXT}${EXTEN})
 same => n,Goto(s,wait)

; *: 確定 → 呼び出し開始
exten => *,1,GotoIf($["${EXT}" = ""]?s,prompt)
 ; 呼び出し開始は担当者全員への DM 送信を待つので、タイムアウトは長め (30 秒)
 same => n,Set(RESP=${SHELL(curl -s -m 30 -H "${API_HDR}" -G --data-urlencode "phone_number=${OTP_NUM}" --data-urlencode "extension=${EXT}" "${API}" | tr -d "\r\n")})
 same => n,Set(STATE=${CUT(RESP, ,1)})
 same => n,NoOp(extension-call ${EXT} -> ${RESP})
 same => n,GotoIf($["${STATE}" = "RINGING"]?ringing)
 same => n,GotoIf($["${STATE}" = "CLOSED"]?closed)
 same => n,GotoIf($["${STATE}" = "UNKNOWN"]?s,prompt)
 same => n,Goto(callback)
 ; 呼び出し中: 保留音を 3 秒流しては状態を確認 (60 回 = 3 分)
 same => n(ringing),Set(REQ_ID=${CUT(RESP, ,2)})
 same => n,Playback(ivr/ext_ringing)
 same => n,Set(POLLS=0)
 same => n(poll),Set(POLLS=$[${POLLS} + 1])
 same => n,GotoIf($[${POLLS} > 60]?timeout)
 same => n,MusicOnHold(telauth-hold,3)
 same => n,Set(RESP=${SHELL(curl -s -m 10 -H "${API_HDR}" "${API}/${REQ_ID}/status" | tr -d "\r\n")})
 same => n,Set(STATE=${CUT(RESP, ,1)})
 same => n,GotoIf($["${STATE}" = "ACCEPTED"]?bridge)
 same => n,GotoIf($["${STATE}" = "RINGING"]?poll)
 same => n,Goto(callback)
 ; 担当者が出た: ブラウザが通話ページを開いて web<N> として登録されるまで待ってから Dial
 same => n(bridge),Set(SLOT=${CUT(RESP, ,2)})
 same => n,NoOp(Staff accepted, waiting for ${SLOT} to register)
 same => n,Set(WAITS=0)
 same => n(waitreg),Set(WAITS=$[${WAITS} + 1])
 same => n,GotoIf($[${WAITS} > 30]?callback)
 same => n,GotoIf($["${PJSIP_AOR(${SLOT},contact)}" != ""]?dial)
 same => n,MusicOnHold(telauth-hold,3)
 same => n,Goto(waitreg)
 same => n(dial),NoOp(Bridging ${OTP_NUM} to browser ${SLOT})
 same => n,Dial(PJSIP/${SLOT},30)
 same => n,NoOp(Browser dial ended: ${DIALSTATUS})
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?done)
 same => n,Playback(ivr/ext_callback)
 same => n(done),Hangup()
 ; 応答なし (3 分)
 same => n(timeout),System(curl -s -m 10 -H "${API_HDR}" "${API}/${REQ_ID}/timeout")
 ; 「申し訳ありませんが、後ほどお掛け直しください。」
 same => n(callback),Playback(ivr/ext_callback)
 same => n,Hangup()
 ; 受付時間外
 same => n(closed),Playback(ivr/ext_closed)
 same => n,Hangup()

; 無入力 (10秒): 案内をもう一度
exten => t,1,Goto(s,prompt)

; 数字と * 以外 (# など): 無視して待ち続ける
exten => i,1,NoOp(Ignoring key ${INVALID_EXTEN})
 same => n,Goto(s,wait)

; 切断時: 呼び出し中・通話中なら API に終了を伝える (DM を「通話終了」に編集)
exten => h,1,GotoIf($["${REQ_ID}" = ""]?done)
 same => n,System(curl -s -m 10 -H "${API_HDR}" "${API}/${REQ_ID}/ended")
 same => n(done),NoOp(Extension call finished for ${OTP_NUM})

; 担当者ブラウザ (web1..webN) からの発信は今のところ受け付けない
[from-webrtc]
exten => _.,1,NoOp(Outbound from browser ${CALLERID(num)} to ${EXTEN} is not allowed)
 same => n,Hangup()

; ---------------------------------------------------------------------------
; アウトバウンド (AMI Originate 用)
; ---------------------------------------------------------------------------
[outbound-otp]
exten => _X.,1,NoOp(OTP Call to ${EXTEN})
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(${WAVFILE})
 same => n,Hangup()
