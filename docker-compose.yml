services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./.env:/app/.env
      - ./sounds:/var/lib/asterisk/sounds/telauth
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/telauth.db
      - ASTERISK_HOST=asterisk
    depends_on:
      - asterisk
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3

  asterisk:
    build:
      context: .
      dockerfile: Dockerfile.asterisk
    ports:
      - "5060:5060/udp"
      - "10000-20000:10000-20000/udp"
    volumes:
      # FastAPIが生成した音声ファイルをAsteriskが読めるようにマウント
      - ./sounds:/var/lib/asterisk/sounds/telauth
    env_file:
      - .env
    restart: unless-stopped
    network_mode: "host" # SIP/RTPの通信（NAT越え）を安定させるために推奨
